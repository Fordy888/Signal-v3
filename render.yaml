services:
  # Source-controlled containment. The live dashboard schedule remains separately
  # governed; subscriber delivery must not be enabled from this blueprint.
  - type: cron
    name: dtl-signal
    runtime: python
    schedule: "0 0 1 1 *"
    buildCommand: pip install -r requirements.txt && python -m unittest discover -s tests -v
    startCommand: python -m src.main --dry-run --enhanced --alive-moment
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: signal@signal.dtlc.ai
      - key: PROOF_RECIPIENT_EMAIL
        sync: false
      - key: WEBSITE_BASE_URL
        sync: false
      - key: SIGNAL_PIPELINE_API_KEY
        sync: false
      - key: BETTERSTACK_HEARTBEAT_URL
        sync: false
      - key: SIGNAL_REGISTRY_DATABASE_URL
        sync: false
      - key: SIGNAL_REGISTRY_REQUIRED
        value: "1"
      - key: SIGNAL_RELEASE_PROFILE
        value: v4.0
      - key: SIGNAL_V4_LAUNCH_DATE
        value: "2026-08-31"
      - key: SIGNAL_EXPECTED_DAILY_RENDERER
        value: enhanced-v4-focus-numbers
      - key: SIGNAL_EXPECTED_GIT_BRANCH
        value: master
      - key: SIGNAL_EXPECTED_GIT_COMMIT
        sync: false
      - key: SIGNAL_EXPECTED_RENDER_SERVICE_ID
        value: crn-d8ouk0bsq97s73fgc36g
      - key: SIGNAL_ALIVE_MOMENT_PATH
        value: data/alive_moments/{date}.json
      - key: MODEL_SCORING
        value: claude-haiku-4-5-20251001
      - key: MODEL_SYNTHESIS
        value: claude-sonnet-4-6
      - key: MODEL_FOUNDERS_NOTE
        value: claude-sonnet-4-6
      - key: ENABLE_GAUGE
        value: off
      - key: GAUGE_BASE_URL
        value: https://dtlc.ai/api/gauge
      - key: TZ
        value: Australia/Brisbane
      - key: PYTHON_VERSION
        value: "3.11.9"
    plan: standard
    region: singapore
    maxShutdownDelaySeconds: 30

  # Manual proof containment. A dated proof must later be prepared and delivered
  # through the registry by an explicit, reviewed command—not this placeholder.
  - type: cron
    name: dtl-signal-proof
    runtime: python
    schedule: "0 0 1 1 *"
    buildCommand: pip install -r requirements.txt && python -m unittest discover -s tests -v
    startCommand: python -m src.main --dry-run --enhanced --alive-moment
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: signal@signal.dtlc.ai
      - key: PROOF_RECIPIENT_EMAIL
        value: paul.ford@gmail.com
      - key: WEBSITE_BASE_URL
        sync: false
      - key: SIGNAL_PIPELINE_API_KEY
        sync: false
      - key: SIGNAL_REGISTRY_DATABASE_URL
        sync: false
      - key: SIGNAL_REGISTRY_REQUIRED
        value: "1"
      - key: SIGNAL_ALIVE_MOMENT_PATH
        value: data/alive_moments/{date}.json
      - key: MODEL_SCORING
        value: claude-haiku-4-5-20251001
      - key: MODEL_SYNTHESIS
        value: claude-sonnet-4-6
      - key: MODEL_FOUNDERS_NOTE
        value: claude-sonnet-4-6
      - key: ENABLE_GAUGE
        value: off
      - key: TZ
        value: Australia/Brisbane
      - key: PYTHON_VERSION
        value: "3.11.9"
    plan: standard
    region: singapore
    maxShutdownDelaySeconds: 30
